[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "semantica-workbench"
version = "0.6.0"
description = "Semantica Knowledge Graph Platform for Logistics Reality Ontology"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Semantica Team"}]
dependencies = [
    "semantica>=0.6.0",
    "networkx>=3.1",
    "rdflib>=7.0.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "pyyaml>=6.0",
    "requests>=2.28.0",
    "click>=8.1.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-cov>=4.0"]
research = ["faiss-cpu", "weaviate-client", "spacy", "transformers", "torch"]

[project.scripts]
semantica = "semantica_workbench.cli:main"

[project.urls]
Homepage = "https://github.com/cliffordzhangcheng/semantica-project"
Repository = "https://github.com/cliffordzhangcheng/semantica-project.git"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
