created: '2026-09-15'
description: AKOS-compatible provenance schema linking source → claim → entity/relation
  candidate → analyst judgment → ontology decision → downstream artifact
examples:
- analyst_judgment:
    date: '2026-09-15'
    judgment: confirmed
    reasoning: Clear mention of Maersk as shipping line in operational context
    verifier: OpenMinis
  claim:
    claim_type: entity_mention
    context: Shipping schedule discussion
    normalized_value: Maersk
    text_span: Maersk vessel arriving Xiamen
  downstream_artifact:
  - entities.jsonl:Maersk
  entity_or_relation:
    ambiguity_notes: null
    candidate_id: ENT-Maersk-001
    candidate_type: ShippingLine
    confidence: 0.95
  id: PROV-CW-001
  ontology_decision:
    decision: promote_to_canonical
    notes: Canonical shipping line entity
    target_class: ShippingLine
  source:
    access_path: cliffordzhang@cosmoswhales.com/msg_20260811
    confidence: 0.95
    source_id: COSW-001
    source_type: email_archive
    timestamp: '2026-08-11T10:23:00Z'
schema:
  analyst_judgment:
    properties:
      date:
        format: date
        type: string
      judgment:
        enum:
        - confirmed
        - rejected
        - needs_review
        - candidate
        type: string
      reasoning:
        type: string
      verifier:
        type: string
    type: object
  claim:
    properties:
      claim_type:
        enum:
        - entity_mention
        - relation_extraction
        - value_assertion
        type: string
      context:
        type: string
      normalized_value:
        type: string
      text_span:
        type: string
    type: object
  downstream_artifact:
    items:
      type: string
    type: array
  entity_or_relation:
    properties:
      ambiguity_notes:
        type: string
      candidate_id:
        type: string
      candidate_type:
        type: string
      confidence:
        type: number
    type: object
  id:
    pattern: PROV-[A-Z0-9-]+
    type: string
  ontology_decision:
    properties:
      decision:
        enum:
        - promote_to_canonical
        - keep_as_candidate
        - reject
        - merge_with_existing
        type: string
      notes:
        type: string
      target_class:
        type: string
    type: object
  source:
    properties:
      access_path:
        type: string
      confidence:
        maximum: 1
        minimum: 0
        type: number
      source_id:
        type: string
      source_type:
        enum:
        - email_archive
        - document
        - web_scrape
        - manual_entry
        type: string
      timestamp:
        format: date-time
        type: string
    type: object
schema_version: v1.0
