<!DOCTYPE html>
<html><head><meta charset="utf-8">
<title>AKOS Ontology Workbench</title>
<script src="https://unpkg.com/cytoscape@3.30.2/dist/cytoscape.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:system-ui,sans-serif;background:#0d1117;color:#c9d1d9;height:100vh;display:flex;flex-direction:column}
#topbar{padding:10px 16px;background:#161b22;border-bottom:1px solid #30363d;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
#topbar h1{font-size:16px;white-space:nowrap}
#topbar .stats{font-size:11px;color:#8b949e;display:flex;gap:12px}
#topbar .stats b{color:#58a6ff}
#mode-toggle{display:flex;background:#0d1117;border:1px solid #30363d;border-radius:4px;overflow:hidden}
#mode-toggle button{background:transparent;border:none;color:#8b949e;padding:6px 14px;font-size:12px;cursor:pointer}
#mode-toggle button.active{background:#238636;color:#fff}
#search-wrap{display:flex;gap:6px;align-items:center;margin-left:auto}
#search{background:#0d1117;border:1px solid #30363d;border-radius:4px;color:#c9d1d9;padding:6px 10px;font-size:12px;width:200px;outline:none}
#search:focus{border-color:#58a6ff}
#toolbar{padding:8px 16px;background:#161b22;border-bottom:1px solid #21262d;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
#toolbar button{background:#21262d;color:#c9d1d9;border:1px solid #30363d;border-radius:4px;padding:5px 12px;font-size:12px;cursor:pointer;transition:all .15s}
#toolbar button:hover{background:#30363d;border-color:#58a6ff}
#toolbar select{background:#21262d;color:#c9d1d9;border:1px solid #30363d;border-radius:4px;padding:5px;font-size:12px;outline:none}
.tabbar{display:flex;background:#161b22;border-bottom:1px solid #30363d}
.tabbar button{background:transparent;border:none;color:#8b949e;padding:10px 16px;font-size:12px;cursor:pointer;border-bottom:2px solid transparent}
.tabbar button.active{color:#58a6ff;border-bottom-color:#58a6ff}
.main{flex:1;display:flex;overflow:hidden}
#cy{flex:1;background:#0d1117}
#sidepanel{width:380px;background:#161b22;border-left:1px solid #30363d;overflow-y:auto;padding:14px}
#sidepanel h2{font-size:13px;color:#58a6ff;margin-bottom:10px;border-bottom:1px solid #21262d;padding-bottom:6px;display:flex;justify-content:space-between;align-items:center}
#sidepanel h2 .badge{font-size:10px;padding:2px 8px;border-radius:10px;background:#21262d;color:#8b949e}
#sidepanel .field{margin:8px 0;font-size:12px}
#sidepanel .field .k{color:#8b949e;font-size:10px;text-transform:uppercase;letter-spacing:.5px}
#sidepanel .field .v{color:#c9d1d9;margin-top:2px;word-break:break-word}
#sidepanel .field .v.risk-high{color:#f85149}
#sidepanel .field .v.risk-amber{color:#d29922}
#sidepanel .field .v.risk-green{color:#3fb950}
#sidepanel .rel-list{margin-top:6px}
#sidepanel .rel-item{background:#21262d;border-radius:4px;padding:6px 10px;margin:4px 0;font-size:11px;display:flex;justify-content:space-between;align-items:center}
#sidepanel .rel-item .rt{color:#58a6ff}
#sidepanel .rel-item .rd{color:#8b949e}
.legend{position:absolute;bottom:10px;left:16px;background:#161b22;border:1px solid #30363d;border-radius:8px;padding:10px 12px;font-size:10px;max-width:220px;max-height:140px;overflow-y:auto;z-index:10}
.legend .lg{display:flex;align-items:center;gap:5px;margin:2px 0}
.legend .dot{width:9px;height:9px;border-radius:2px;flex-shrink:0}
#tooltip{position:fixed;background:#161b22;border:1px solid #58a6ff;border-radius:6px;padding:8px 12px;font-size:11px;z-index:100;pointer-events:none;max-width:260px;display:none;box-shadow:0 4px 12px rgba(0,0,0,.5)}
.hidden{display:none!important}
.mode-explorer .candidate{display:block}
.mode-governed .candidate{display:none}
.mode-governed .validated{display:block}
.mode-explorer .validated{display:block}
</style></head><body>
<div id="topbar">
<h1>AKOS Ontology Workbench</h1>
<div class="stats"><span><b id="c-entities">0</b> Entities</span><span><b id="c-relations">0</b> Relations</span><span><b id="c-canonical">0</b> Canonical</span><span style="color:#238636">Gate: PASS</span></div>
<div class="mode-toggle">
<button id="btn-explorer" class="active" onclick="setMode('explorer')">Explorer</button>
<button id="btn-governed" onclick="setMode('governed')">Governed</button>
</div>
<div class="search-wrap">
<input id="search" placeholder="Search entities, relations, provenance...">
</div>
</div>
<div id="toolbar">
<button onclick="fit()">Fit</button>
<button onclick="zoom(1.2)">Zoom+</button>
<button onclick="zoom(0.8)">Zoom-</button>
<button onclick="toggleLabels()">Hide Labels</button>
<select id="groupFilter" onchange="filterByGroup(this.value)"><option value="">All Groups</option></select>
<select id="confFilter" onchange="filterByConf(this.value)">
<option value="">All Confidence</option>
<option value="0.9">≥0.9</option>
<option value="0.7">≥0.7</option>
<option value="0.5">≥0.5</option>
</select>
<button onclick="resetFilter()">Reset</button>
</div>
<div class="tabbar">
<button class="active" onclick="switchTab('graph',this)">Knowledge Graph</button>
<button onclick="switchTab('ontology',this)">Ontology Classes</button>
<button onclick="switchTab('review',this)">Review Queue</button>
<button onclick="switchTab('timeline',this)">Change History</button>
</div>
<div class="main">
<div id="cy"></div>
<div id="sidepanel">
<h2>Entity Details <span class="badge" id="entity-badge">—</span></h2>
<div id="detail"></div>
</div>
</div>
<div class="legend" id="legend"></div>
<div id="tooltip"></div>
