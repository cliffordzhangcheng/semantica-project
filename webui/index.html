<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Semantica AKOS Portal</title>
  <script src="graph_data.js"></script>
  <style>
    body { font-family: sans-serif; margin: 0; padding: 20px; background: #f5f5f5; }
    .container { max-width: 1200px; margin: 0 auto; }
    .header { background: #24292e; color: white; padding: 20px; border-radius: 8px; margin-bottom: 20px; }
    .stats { display: flex; gap: 20px; margin-top: 10px; }
    .stat { background: #f6f8fa; padding: 10px 20px; border-radius: 4px; }
    .gate-status { margin-top: 20px; padding: 15px; border-radius: 4px; }
    .gate-pass { background: #dafbe1; border: 1px solid #155724; }
    .gate-fail { background: #ffebe9; border: 1px solid #82071e; }
    .gate-unknown { background: #fff9c4; border: 1px solid #827b00; }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>Semantica AKOS Portal</h1>
      <p>意保克空运货代 Ontology v0.2.1</p>
      <div class="stats">
        <div class="stat"><span id="c-entities">0</span> Entities</div>
        <div class="stat"><span id="c-relations">0</span> Relations</div>
        <div class="stat"><span id="c-canonical">0</span> Canonical</div>
      </div>
      <!-- R09: 动态显示闸门状态，不再硬编码 -->
      <div id="gate-status" class="gate-status gate-unknown">
        Gate: <b id="gate-result">LOADING</b>
      </div>
    </div>
    <div id="graph-container" style="height: 600px; background: white; border-radius: 8px;"></div>
  </div>
  <script>
    // R09: 从闸门结果文件动态加载状态
    async function loadGateStatus() {
      try {
        const response = await fetch('../11-GATE-LEDGER-v0.2.1.json');
        const ledger = await response.json();
        const gates = ledger.gates || {};
        
        let allPass = true;
        let allPassCount = 0;
        let totalGates = 0;
        
        for (const [gate, info] of Object.entries(gates)) {
          if (gate.startsWith('G') && parseInt(gate[1]) <= 6) {
            totalGates++;
            if (info.status === 'PASS') {
              allPassCount++;
            } else {
              allPass = false;
            }
          }
        }
        
        const statusEl = document.getElementById('gate-result');
        const statusDiv = document.getElementById('gate-status');
        
        if (allPass && allPassCount === totalGates && totalGates > 0) {
          statusEl.textContent = 'PASS';
          statusDiv.className = 'gate-status gate-pass';
        } else if (totalGates === 0) {
          statusEl.textContent = 'UNKNOWN';
          statusDiv.className = 'gate-status gate-unknown';
        } else {
          statusEl.textContent = 'FAIL';
          statusDiv.className = 'gate-status gate-fail';
        }
      } catch (e) {
        document.getElementById('gate-result').textContent = 'UNKNOWN';
      }
    }
    
    // 加载图表数据
    const graphData = window.graphData || { nodes: [], edges: [] };
    document.getElementById('c-entities').textContent = graphData.nodes?.length || 0;
    document.getElementById('c-relations').textContent = graphData.edges?.length || 0;
    document.getElementById('c-canonical').textContent = graphData.nodes?.filter(n => n.canonical).length || 0;
    
    // 加载闸门状态
    loadGateStatus();
  </script>
</body>
</html>
