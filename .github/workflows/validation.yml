name: CI
on:
  push:
    branches: [main, '**']
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: |
          pip install pytest
          pip install -e . || true
      - name: Test
        run: pytest tests/ -v
      - name: Check forbidden patterns
        run: |
          if grep -r "CONTEXT OFFLOADED\|offloaded.*tmpfile" --include="*.py" src/ 2>/dev/null; then
            echo "ERROR: Found CONTEXT OFFLOADED pattern in source files"
            exit 1
          fi