name: CI
on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: pip install -e '.[dev]' -c constraints.txt
      - name: Regression tests and independent clean rebuilds
        run: python scripts/verify_runtime.py --output artifacts/verification
      - name: Revalidate accepted snapshot from disk
        run: python -m semantica_workbench.cli validate --output artifacts/verification/closure/run1
      - name: Upload runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runtime-closure-${{ github.sha }}
          path: artifacts/
