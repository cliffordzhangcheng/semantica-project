# R07: CI - 自动化验证闸门
name: Semantica Validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          
      - name: Install dependencies
        run: pip install -r requirements.txt
        
      - name: Run G0-G6 validation
        run: python scripts/run_gates.py
        
      - name: Check gate results
        run: |
          if ! grep -q "ALL_PASSED" 11-GATE-LEDGER-v0.2.1.json; then
            echo "❌ Gate validation failed"
            exit 1
          fi
          
      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: gate-results
          path: 11-GATE-LEDGER-v0.2.1.json
