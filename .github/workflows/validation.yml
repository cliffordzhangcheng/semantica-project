name: CI

on:
  push:
    branches: [main, '**']
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: pip install -e ".[dev]"
      - name: Run unit tests
        run: python -m pytest tests/ -v
      - name: Static artifact integrity scan
        run: python scripts/check_artifact_integrity.py --project-root .
      - name: Run E2E pipeline
        run: |
          rm -rf outputs/
          python -m semantica_workbench.cli run
      - name: Extract relations
        run: python scripts/04_relation_extraction.py
      - name: Generate business SPO
        run: python scripts/05_generate_business_spo.py
      - name: Validate gates
        run: python scripts/run_gates.py --project-root . --run-id ci-$(date +%Y%m%d-%H%M%S)
      - name: Post-run artifact integrity scan
        run: python scripts/check_artifact_integrity.py --project-root .
      - name: Check gate ledger
        run: cat outputs/reports/gate_ledger.json
