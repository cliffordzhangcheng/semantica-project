name: Semantica Validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip==24.3.1 setuptools==70.0.0 wheel
          pip install .
          pip install pytest pytest-cov
      - name: Run tests
        run: python -m pytest tests/ -v --tb=short
      - name: Run gate validation
        run: python scripts/run_gates.py || echo "Gate validation expected to FAIL"
