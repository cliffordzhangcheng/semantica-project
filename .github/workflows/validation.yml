name: Semantica Validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip==24.3.1
          python -m pip install setuptools==70.0.0 wheel
          python -m pip install -e .
          python -m pip install pytest pytest-cov
      - name: Compile check
        run: |
          python -m compileall -q scripts src tests
      - name: Shell syntax check
        run: bash -n scripts/run_all.sh
      - name: CLI help check
        run: PYTHONPATH=src python -m semantica_workbench.cli --help
      - name: Run all tests
        run: |
          cd tests
          python -m pytest -q test_smoke.py test_gates.py test_pipeline_compat.py test_run_isolation.py
