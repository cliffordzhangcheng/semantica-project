name: CI
on:
  push:
    branches: [main, '**']
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: pip install -e ".[dev]"
      - name: Run unit tests
        run: python -m pytest tests/ -v
      - name: Run E2E pipeline
        run: |
          rm -rf outputs/
          python -m semantica_workbench.cli run
      - name: Validate gates
        run: python scripts/run_gates.py
      - name: Check gate ledger
        run: cat outputs/reports/gate_ledger.json