name: Test
on: push

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Debug
        run: |
          python --version
          ls -la
          pwd
      - name: Install
        run: pip install -e . pytest 2>&1 || echo "Install failed"
      - name: Test
        run: pytest tests/ -v --tb=short || echo "Tests failed"
