name: Test
on: push

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install project
        run: pip install -e . pytest
      - name: List packages
        run: pip list
      - name: Import test
        run: python -c "import semantica_workbench; print('Import OK')"
      - name: Run tests
        run: pytest tests/ -v --tb=short
