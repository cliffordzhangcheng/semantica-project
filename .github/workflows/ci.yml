# R07: CI - 真实自动化验证
name: Semantica Validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11']
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .
          
      - name: Run schema validation
        run: python tests/test_schema.py
        
      - name: Run gate tests
        run: python tests/test_gates.py
        
      - name: Run export tests
        run: python tests/test_export.py
        
      - name: Check gate ledger
        run: |
          python scripts/run_gates.py
          python -c "
          import json
          with open('artifacts/runs/latest/gate_ledger.json') as f:
              ledger = json.load(f)
          overall = ledger.get('overall', 'FAIL')
          if overall != 'PASS':
              print(f'❌ Gate validation failed: {overall}')
              exit(1)
          print('✅ All gates passed')
          "
          
      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: gate-results
          path: artifacts/runs/latest/
