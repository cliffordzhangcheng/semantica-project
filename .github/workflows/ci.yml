name: CI

on: [push]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: pip install pytest
      - name: Test
        run: PYTHONPATH=src python -m pytest tests/test_smoke.py -v --tb=long
