name: CI

on: [push]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install networkx rdflib pandas numpy pyyaml requests click python-dotenv pytest
      - name: Setup environment
        run: |
          export PYTHONPATH="$PYTHONPATH:$(pwd)/src"
          mkdir -p data/raw data/processed
          cp data/*.md data/raw/ || true
      - name: List installed packages
        run: pip list | grep -i "semantica\|pytest\|networkx\|rdflib\|pandas\|numpy"
      - name: Test imports
        run: python -c "import semantica_workbench; print('Import OK')"
      - name: Run tests
        run: python -m pytest tests/ -v --tb=short
