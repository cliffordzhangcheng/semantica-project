name: CI

on: [push]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: pip install -e . pytest
      - name: List data files
        run: ls -la data/ data/raw/ 2>/dev/null || echo "No data"
      - name: Test
        run: python -m pytest tests/test_smoke.py -v --tb=long
